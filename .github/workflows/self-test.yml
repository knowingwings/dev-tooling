# Runs on every push and PR: every rule must still fire on the bad fixtures (tests/expected/*.txt),
# adopt.sh must still work for every profile, and the kit's own code must pass its own rules.
# Tool versions are pinned so a result change means a rule changed, not a tool upgrade.
# To upgrade a tool: bump it here, run `python3 tests/run_tests.py --update` locally, review the diff.
name: self-test

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

env:
  RUFF_VERSION: "0.16.9"
  CLANG_TIDY_VERSION: "23.1.4"
  RUST_VERSION: "1.97.0"
  TYPST_VERSION: "0.15.1"     # keep in step with lint/typst/.typst-version
  TYPSTYLE_VERSION: "0.15.3"
  TYPOS_VERSION: "1.52.2"     # keep in step with the typos rev in lint/*/.pre-commit-config.yaml

jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # adopt.sh reads the version from tags

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned lint tools
        run: |
          uv tool install "ruff==${RUFF_VERSION}"
          uv tool install "clang-tidy==${CLANG_TIDY_VERSION}"
          uv tool install "typos==${TYPOS_VERSION}"
          clang-tidy --version

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"

      - name: Install Typst and typstyle
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" typst-x86_64-unknown-linux-musl/typst
          cargo install typstyle --locked --version "${TYPSTYLE_VERSION}"
          typst --version && typstyle --version | head -1
          test "$(cat lint/typst/.typst-version)" = "${TYPST_VERSION}"

      - name: Kit's own code passes its own rules
        run: |
          ruff check src tests/*.py
          ruff format --check src tests/*.py
          shellcheck -S warning scripts/*.sh scripts/as-agent lint/shared/*.sh lint/shared/check tests/*.sh vscode/user/*.sh vscode/ros2/.vscode/*.sh
          PYTHONPATH=src python3 -m dev_tooling.check_comments --all-lines src/dev_tooling/*.py tests/run_tests.py
          PYTHONPATH=src python3 -m dev_tooling.check_secrets
          git ls-files '*.md' '*.typ' | xargs typos --config lint/shared/_typos.toml --force-exclude
          test "$(grep -A1 crate-ci/typos lint/python/.pre-commit-config.yaml | grep -o 'v[0-9.]*')" = "v${TYPOS_VERSION}"

      - name: Changed docs follow the STE length rules
        if: github.event_name == 'pull_request'
        run: PYTHONPATH=src python3 -m dev_tooling.check_prose --base "origin/${{ github.base_ref }}"

      - name: Checker unit tests
        run: python3 -m unittest -v tests/test_check_comments.py tests/test_check_git.py tests/test_check.py tests/test_check_prose.py tests/test_check_secrets.py

      - name: as-agent (offline)
        run: bash tests/test_as_agent.sh

      - name: Rules fire on the bad fixtures
        run: python3 tests/run_tests.py --strict

      - name: adopt.sh works for every profile
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          bash tests/test_adopt.sh

  # The kit follows its own PR conventions: same check projects get from lint/github/.
  pr-conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check title, body, branch and changed files
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: PYTHONPATH=src python3 -c "import sys; from dev_tooling.check_git import main_pr; sys.exit(main_pr())"
