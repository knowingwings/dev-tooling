# pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
# Then `pre-commit autoupdate` to bump the revs below to the latest releases.
#
# Fast checks run on every commit (staged files only). clang-tidy needs a build, so it runs on push.
exclude: ^(build|install|log|third_party)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-xml          # package.xml, URDF
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]   # keeps rosbags and meshes out of git

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/knowingwings/dev-tooling
    rev: v0.1.0   # adopt.sh sets this to the kit version you adopted
    hooks:
      - id: check-patterns
      - id: check-comments
      - id: check-branch
      - id: clang-tidy
