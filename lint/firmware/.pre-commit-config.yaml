# pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
# Then `pre-commit autoupdate` to bump the revs below.
exclude: ^(build|Drivers|third_party|vendor|Middlewares)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]   # keeps .elf/.bin build outputs out of git

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/astral-sh/ruff-pre-commit   # for your Python test/flash/tooling scripts
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos             # British spelling in docs; settings in _typos.toml
        args: [--force-exclude]
        files: \.(md|markdown|typ|rst|txt)$

  - repo: https://github.com/knowingwings/dev-tooling
    rev: v0.1.0   # adopt.sh sets this to the kit version you adopted
    hooks:
      - id: check-patterns
      - id: check-comments
      - id: check-branch
      - id: check-prose
      - id: check-secrets
      - id: clang-tidy
