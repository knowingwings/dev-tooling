# Spelling for docs (typos hook): British English, as AGENTS.md asks. The hook only checks Markdown,
# Typst, reStructuredText and text files, so American spellings in code and APIs (`color`) are left alone.
# Fenced blocks, inline code and HTML tags (`<div style="text-align: center">`) in docs are skipped too.
# Put product, API and code names in backticks, or add them to [default.extend-words].
[default]
locale = "en-gb"
extend-ignore-re = [
  "(?s)```.*?```",
  "`[^`\n]+`",
  "<[A-Za-z][^>\n]*>",
  "\\b[\\w.-]+-analyzer\\b",
]

[default.extend-words]

# Typst built-ins that use American spelling (`center`, `color`, `gray`). Typos can't tell Typst
# code from Typst prose, so these words are accepted in .typ files only.
[type.typst]
extend-glob = ["*.typ"]

[type.typst.extend-words]
center = "center"
color = "color"
gray = "gray"
