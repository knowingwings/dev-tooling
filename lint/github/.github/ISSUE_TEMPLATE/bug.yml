name: Bug
description: Something behaves wrongly. Enough detail to reproduce it without the reporter.
title: "fix(<scope>): <what goes wrong>"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens, and what should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Exact commands, launch files, bag file, firmware version, or bench setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, plots, screenshots, scope captures. Paste text rather than screenshots of text.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: git describe --tags --always
  - type: dropdown
    id: where
    attributes:
      label: Where it shows up
      multiple: true
      options: [Simulation, Bag replay, Bench / HIL, Real robot, CI, Host tests]
