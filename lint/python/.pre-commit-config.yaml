# pip install pre-commit (or `uv tool install pre-commit`) && pre-commit install && pre-commit install --hook-type pre-push
# The commit hooks check the files you commit, with the project's own ruff and pyright (uv.lock).
# ./check and CI check the whole project; pytest runs on push.
exclude: ^(\.venv|build|dist)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]   # keeps captured logs and datasets out of git

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos             # British spelling in docs; settings in _typos.toml
        args: [--force-exclude]
        files: \.(md|markdown|typ|rst|txt)$

  - repo: https://github.com/knowingwings/dev-tooling
    rev: v0.1.0   # adopt.sh sets this to the kit version you adopted
    hooks:
      - id: check-comments
      - id: check-branch
      - id: check-prose
      - id: check-secrets

  - repo: local
    hooks:
      - id: ruff
        name: ruff (files you commit)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format (files you commit)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: pyright
        name: pyright (files you commit)
        entry: uv run pyright
        language: system
        types: [python]

      - id: pytest
        name: pytest (no hardware)
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
