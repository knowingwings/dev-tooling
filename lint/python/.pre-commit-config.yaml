# pip install pre-commit (or `uv tool install pre-commit`) && pre-commit install && pre-commit install --hook-type pre-push
exclude: ^(\.venv|build|dist)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]   # keeps captured logs and datasets out of git

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos             # British spelling in docs; settings in _typos.toml
        args: [--force-exclude]
        files: \.(md|markdown|typ|rst|txt)$

  - repo: https://github.com/knowingwings/dev-tooling
    rev: v0.1.0   # adopt.sh sets this to the kit version you adopted
    hooks:
      - id: check-comments
      - id: check-branch
      - id: check-prose
      - id: check-secrets

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (no hardware)
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
