# Settings for dev-tooling hooks in a standalone Python project.

# ---- No new comments (check-comments hook) -----------------------------------------------------
# Comments go stale and agents use them to justify workarounds: say it in a name, a type hint, a
# check, a test or the commit message. Docstrings are not comments and stay welcome. Allowed: noqa /
# pyright: ignore / type: ignore with a reason, REF(<source>): <fact>, licence headers.
# Only lines added in a commit are checked.
[comments]
enabled = true
exclude = ["tests/**", "**/tests/**", ".venv/**", "build/**", "dist/**"]

# ---- Git and PR conventions (check-branch hook, pr-checks workflow) -----------------------------
# Defaults shown; uncomment to change. Trunk-based by default: add "develop" to protected_branches
# to keep an integration branch.
[git]
# Let Low-risk, approved PRs merge themselves when green (.github/workflows/auto-merge.yml).
# With branch protection it uses GitHub's auto-merge; without, it waits for every check itself.
# Medium/High always wait for a person.
automerge = true
# protected_branches = ["main", "master"]
# branch_types = ["feat", "feature", "fix", "docs", "refactor", "perf", "test", "build", "ci", "chore", "revert", "hotfix", "release"]
# agent_prefixes = ["claude", "cursor", "codex", "copilot", "agent", "dependabot", "renovate"]
# require_evidence = true
# require_risk = true

# ---- dev-check: ./check runs these in order and prints one line each ------------------------------
[[check.step]]
name = "hooks"
run = "pre-commit run --files {changed}"

[[check.step]]
name = "ruff"
run = "uv run ruff check ."
needs = ["uv"]
errors = '^\S+:\d+:\d+: '

[[check.step]]
name = "pyright"
run = "uv run pyright"
needs = ["uv"]
summary = '(\d+ errors?, \d+ warnings?)'
errors = ' - error: '

[[check.step]]
name = "pytest"
run = "uv run pytest -q"
needs = ["uv"]
summary = '(\d+ passed.*?)(?: in [\d.]+s)'
errors = '(FAILED|ERROR)'
