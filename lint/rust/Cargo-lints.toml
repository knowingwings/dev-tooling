# Paste into your WORKSPACE Cargo.toml, then add this to every member crate's Cargo.toml:
#
#   [lints]
#   workspace = true
#
# CI / pre-push runs `cargo clippy --all-targets -- -D warnings`, so "warn" fails the push too.
# "warn" just keeps it from blocking you mid-edit in the editor.

[workspace.lints.rust]
unsafe_code = "deny"                 # HAL/BSP crates that need unsafe: give them their own [lints] table instead of workspace = true
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# --- Suppressions must say why (Rust's version of lint-allow) ------------------
# Forces #[expect(clippy::x, reason = "...")] instead of a bare #[allow]. `expect` also
# warns when the lint no longer fires, so stale suppressions get cleaned up.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"  # every unsafe block needs a `// SAFETY:` comment explaining the invariant

# --- No hidden panics in robot code --------------------------------------------
unwrap_used = "deny"                 # return/propagate the error, or handle it
expect_used = "warn"                 # ok at startup for truly-impossible states; prefer `?`
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"                # use log/tracing (host) or defmt (embedded)
print_stderr = "deny"

# --- Numeric conversions: the Rust equivalent of -Wconversion -------------------
cast_possible_truncation = "deny"    # e.g. f32 -> u16 PWM duty, i32 -> u8
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "warn"               # prefer From/Into when lossless
float_cmp = "deny"

# --- Pedantic lints that are mostly noise --------------------------------------
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# --- Extra for no_std firmware crates (put in the firmware crate's own [lints]) ---
# indexing_slicing = "deny"          # v[i] panics on out-of-bounds; use .get(i)
# arithmetic_side_effects = "warn"   # overflow panics in debug, wraps in release
# large_stack_arrays = "deny"
