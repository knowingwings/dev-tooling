# Rust rules for the check-patterns hook from dev-tooling (same checker as the C/C++ and ROS profiles).
# Mostly for single-crate repos: in a workspace, the per-crate `unsafe_code = "deny"` lint does the same job.

[[rule]]
id = "rs-unsafe-outside-hal"
pattern = '\bunsafe\s*(\{|fn\b|impl\b)'
include = ["**/*.rs"]
exclude = ["**/hal/**", "**/bsp/**", "crates/*-hal/**", "crates/*-bsp/**", "target/**"]
message = """unsafe belongs in the hal/bsp module behind a safe API. Add (or extend) a safe wrapper there \
with a // SAFETY: comment, and call that from here."""

[[rule]]
id = "rs-no-static-mut"
pattern = '\bstatic\s+mut\b'
include = ["**/*.rs"]
exclude = ["target/**"]
message = """static mut is a data race waiting for an interrupt. Use an atomic, \
critical_section::Mutex<RefCell<T>>, an embassy channel/signal, or RTIC shared resources."""

# ---- No new comments (check-comments hook) -----------------------------------------------------
# Comments go stale and agents use them to justify workarounds: say it in a name, a type, a check,
# a test or the commit message. Allowed: /// and //! docs, // SAFETY: (clippy requires it on unsafe),
# REF(<source>): <fact>, lint-allow / #[expect(.., reason)], licence headers. Only added lines are checked.
[comments]
enabled = true
exclude = ["target/**", "tests/**", "**/tests/**", "benches/**", "examples/**"]

# ---- Git and PR conventions (check-branch hook, pr-checks workflow) -----------------------------
# Defaults shown; uncomment to change. Trunk-based by default: add "develop" to protected_branches
# to keep an integration branch.
[git]
# Let Low-risk, approved PRs merge themselves when green (.github/workflows/auto-merge.yml).
# Needs branch protection with required status checks on main; Medium/High always wait for a person.
automerge = true
# protected_branches = ["main", "master"]
# branch_types = ["feat", "feature", "fix", "docs", "refactor", "perf", "test", "build", "ci", "chore", "revert", "hotfix", "release"]
# agent_prefixes = ["claude", "cursor", "codex", "copilot", "agent", "dependabot", "renovate"]
# require_evidence = true
# require_risk = true

# ---- dev-check: ./check runs these in order and prints one line each ------------------------------
[[check.step]]
name = "hooks"
run = "pre-commit run --files {changed}"

[[check.step]]
name = "fmt"
run = "cargo fmt --all --check"
needs = ["cargo"]
errors = '^Diff in'

[[check.step]]
name = "clippy"
run = "cargo clippy --workspace --all-targets --quiet -- -D warnings"
needs = ["cargo"]
errors = '^(error|warning)|^\s+--> '

[[check.step]]
name = "test"
run = "cargo test --workspace --quiet"
needs = ["cargo"]
slow = true
summary = 'test result: (\w+\. \d+ passed; \d+ failed)'
errors = '(panicked|FAILED|^error)'
