# pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
# rustfmt and the pattern checker run on commit. clippy and tests compile, so they run on push.
exclude: ^target/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/knowingwings/dev-tooling
    rev: v0.1.0   # adopt.sh sets this to the kit version you adopted
    hooks:
      - id: check-patterns
      - id: check-comments

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      # Supply chain: licences, advisories, duplicate deps. `cargo install cargo-deny && cargo deny init`
      # - id: cargo-deny
      #   name: cargo deny
      #   entry: cargo deny check
      #   language: system
      #   pass_filenames: false
      #   stages: [pre-push]
