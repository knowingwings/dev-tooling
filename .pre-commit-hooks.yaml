# Hooks other repos use by referencing this repo in their .pre-commit-config.yaml:
#
#   - repo: https://github.com/knowingwings/dev-tooling
#     rev: v0.1.0
#     hooks:
#       - id: check-patterns
#       - id: check-comments
#       - id: clang-tidy
#
# Each project keeps its own patterns.toml / .clang-tidy: the rules are per project, the tools are shared.

- id: check-patterns
  name: project pattern rules (patterns.toml)
  description: Path-scoped banned patterns with fix-it messages, configured by patterns.toml in the project root.
  entry: check-patterns
  language: python
  types_or: [c, c++, python, rust]

- id: check-comments
  name: no new comments
  description: Blocks comments on added lines unless they're doc comments, SAFETY, REF(source), suppressions or licence headers. Configured by [comments] in patterns.toml.
  entry: check-comments
  language: python
  types_or: [c, c++, python, rust]

- id: clang-tidy
  name: clang-tidy (changed files)
  description: Runs clang-tidy using the project's compile_commands.json files. Needs clang-tidy 20+ on PATH.
  entry: lint/shared/clang_tidy.sh
  language: script
  types_or: [c, c++]
  stages: [pre-push]

- id: typst-compile
  name: typst compile (pinned version, no system fonts)
  description: Compiles every document in .typst-entries (or every main.typ) to build/, checking the Typst version in .typst-version.
  entry: lint/shared/typst_compile.sh
  language: script
  files: \.(typ|bib|yaml|yml|csv|json|svg|png|jpe?g|otf|ttf)$
  pass_filenames: false
  stages: [pre-push]
