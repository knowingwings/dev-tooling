# Makes this repo installable as a pre-commit hook source (see .pre-commit-hooks.yaml).
[project]
name = "dev-tooling"
version = "0.4.0"
description = "Lint rules, editor config, agent instructions and setup scripts for ROS 2, embedded C/C++, Rust, Python and Typst repos"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
check-patterns = "dev_tooling.check_patterns:main"
check-comments = "dev_tooling.check_comments:main"
check-branch = "dev_tooling.check_git:main_branch"
check-pr = "dev_tooling.check_git:main_pr"
dev-check = "dev_tooling.check:main"
check-automerge = "dev_tooling.check_git:main_automerge"
check-prose = "dev_tooling.check_prose:main"
check-secrets = "dev_tooling.check_secrets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_tooling"]

[tool.ruff]
line-length = 100
target-version = "py310"
output-format = "concise"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# The kit's own Python is held to the same rules it gives projects (lint/python/pyproject.toml).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "ANN", "PTH", "PERF", "PLE", "PLW", "S", "TID", "DTZ", "BLE", "T20"]
ignore = ["ANN401", "S101"]

[tool.ruff.lint.per-file-ignores]
"src/dev_tooling/check_patterns.py" = ["S603"]   # runs `git ls-files` with a fixed argument list
"tests/run_tests.py" = ["S603", "S607", "T20"]       # test runner: calls the tools under test, prints results
"src/dev_tooling/check_comments.py" = ["S603"]   # runs git with fixed arguments
"tests/test_check_comments.py" = ["S603", "S607", "ANN"]
"src/dev_tooling/check_git.py" = ["S603"]   # runs git with fixed arguments
"tests/test_check_git.py" = ["S603", "S607", "ANN"]
"src/dev_tooling/check.py" = ["S603"]   # runs the project's own configured check commands
"tests/test_check.py" = ["S603", "S607", "ANN"]
"tests/test_check_prose.py" = ["S603", "S607", "ANN"]
"tests/test_check_secrets.py" = ["ANN"]
